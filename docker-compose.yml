version: '3.8'

services:
  nexapay-postgres:
    image: pgvector/pgvector:pg16
    container_name: nexapay_postgres
    restart: always
    environment:
      POSTGRES_DB: nexapay_db
      POSTGRES_USER: nexapay_user
      POSTGRES_PASSWORD: nexapay_password
    ports:
      - "5432:5432"
    volumes:
      - nexapay_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nexapay_user -d nexapay_db"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - nexapay-network

  nexapay-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: nexapay_platform
    restart: on-failure
    depends_on:
      nexapay-postgres:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://nexapay-postgres:5432/nexapay_db
      SPRING_DATASOURCE_USERNAME: nexapay_user
      SPRING_DATASOURCE_PASSWORD: nexapay_password
      OPENAI_API_KEY: ${OPENAI_API_KEY:-mock-key}
    ports:
      - "8080:8080"
    networks:
      - nexapay-network

networks:
  nexapay-network:
    driver: bridge

volumes:
  nexapay_pgdata:
