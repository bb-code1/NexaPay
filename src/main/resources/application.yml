server:
  port: 8080
  shutdown: graceful

spring:
  application:
    name: nexapay-platform

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/nexapay_db}
    username: ${SPRING_DATASOURCE_USERNAME:nexapay_user}
    password: ${SPRING_DATASOURCE_PASSWORD:nexapay_password}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      idle-timeout: 300000
      max-lifetime: 1800000
      connection-timeout: 20000

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        jdbc:
          batch_size: 50
          order_inserts: true
          order_updates: true

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

  ai:
    openai:
      base-url: ${AI_BASE_URL:https://generativelanguage.googleapis.com/v1beta/openai/}
      api-key: ${GEMINI_API_KEY:${OPENAI_API_KEY:mock-key}}
      chat:
        options:
          model: ${AI_MODEL:gemini-1.5-flash}
          temperature: 0.1
    vectorstore:
      pgvector:
        index-type: HNSW
        distance-type: COSINE_DISTANCE
        dimensions: 1536
        table-name: vector_store
        schema-name: public
        initialize-schema: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always

resilience4j:
  circuitbreaker:
    instances:
      aiInvestigationService:
        sliding-window-type: COUNT_BASED
        sliding-window-size: 10
        minimum-number-of-calls: 5
        failure-rate-threshold: 50.0
        wait-duration-in-open-state: 5s
        permitted-number-of-calls-in-half-open-state: 3
        automatic-transition-from-open-to-half-open-enabled: true
      paymentGatewayService:
        sliding-window-type: COUNT_BASED
        sliding-window-size: 10
        minimum-number-of-calls: 5
        failure-rate-threshold: 50.0
        wait-duration-in-open-state: 5s
  retry:
    instances:
      paymentGatewayRetry:
        max-attempts: 3
        wait-duration: 300ms
        enable-exponential-backoff: true
        exponential-backoff-multiplier: 2
  ratelimiter:
    instances:
      aiInvestigationLimiter:
        limit-for-period: 30
        limit-refresh-period: 1s
        timeout-duration: 500ms
  bulkhead:
    instances:
      aiBulkhead:
        max-concurrent-calls: 15
        max-wait-duration: 200ms

  metrics:
    export:
      prometheus:
        enabled: true

nexapay:
  ai:
    model-provider: ${NEXAPAY_AI_PROVIDER:openai} # openai, gemini, ollama
    benchmark-enabled: true
    confidence-threshold: 0.80
  security:
    jwt-secret: ${JWT_SECRET:dGhpcy1pcy1hLXNlY3VyZS01MTItYml0LXNlY3JldC1rZXktZm9yLW5leGFwYXktand0LWF1dGhlbnRpY2F0aW9u}
    token-validity-seconds: 86400
